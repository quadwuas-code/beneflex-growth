<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="Enter your password to open the BeneFlex website.">
  <title>BeneFlex | Private access</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#102b43;font:16px/1.6 Arial,Helvetica,sans-serif;min-height:100svh;display:grid;place-items:center;padding:28px}main{width:min(100%,440px);background:white;border:1px solid #d5e0eb;border-radius:18px;overflow:hidden;box-shadow:0 20px 70px #102b4310}.brand{background:#0b2541;color:white;padding:26px 32px;font-size:24px;font-weight:700;letter-spacing:-.5px}.brand span{display:block;font-weight:400;font-size:14px;color:#b5efdd;letter-spacing:.4px;margin-top:2px}.content{padding:32px}h1{font-size:28px;line-height:1.2;letter-spacing:-.8px;margin:0 0 14px}p{color:#56697b;margin:0 0 24px}label{display:block;font-weight:600;margin-bottom:8px}input,button{font:inherit;width:100%;border-radius:8px;padding:13px 15px}input{border:1px solid #aebfce;color:#102b43;background:white}button{background:#215cef;color:white;font-weight:600;border:0;margin-top:18px;cursor:pointer}button:hover{background:#174dd0}button:disabled{opacity:.7;cursor:wait}:focus-visible{outline:3px solid #4385ff;outline-offset:3px}.message{color:#a33725;font-size:14px;min-height:23px;margin:13px 0 0}.note{border-top:1px solid #e4ebf2;margin:20px 0 0;padding-top:20px;font-size:14px}.note:last-child{margin-bottom:0}@media(max-width:420px){body{padding:16px}.brand,.content{padding:25px}}
  </style>
</head>
<body>
  <main>
    <div class="brand">BeneFlex<span>Private access</span></div>
    <div class="content">
      <h1>Welcome back.</h1>
      <p>Enter the shared password to open the Growth Brief and Pipeline Playbook.</p>
      <form id="unlock-form">
        <label for="password">Website password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required autofocus aria-describedby="unlock-message">
        <button id="unlock-button" type="submit">Unlock website</button>
        <p class="message" id="unlock-message" role="status" aria-live="polite"></p>
      </form>
      <p class="note">Access stays open in this tab. Refresh or choose “Lock site” to lock it again.</p>
      <noscript><p>JavaScript is required to unlock the encrypted website.</p></noscript>
    </div>
  </main>
  <script type="module" src="./unlock.mjs"></script>
</body>
</html>
